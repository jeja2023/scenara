name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scenara-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements/dev.txt
      - name: Verify the Linux production dependency lock
        run: |
          uv pip compile requirements/production.in --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-emit-index-url --output-file requirements/production.lock
          git diff --exit-code -- requirements/production.lock
      - run: python -m ruff check scenara app tests sdk/python scripts
      - run: python -m mypy scenara app sdk/python/scenara_sdk
      - run: python -m pytest -q --cov=scenara --cov=app --cov=sdk/python/scenara_sdk --cov-report=term --cov-fail-under=60
      - run: python scripts/generate_typescript_sdk.py --check
      - run: python scripts/export_openapi.py --check
      - name: Verify and package repository contracts
        run: python scripts/repository_contracts.py --check --bundle repository-contracts-1.0.0.zip
      - run: python scripts/repository_gate.py
      - run: python scripts/release_gate.py --implementation-only
      - name: Validate deployment shell scripts
        run: bash -n deploy/scripts/*.sh
      - uses: actions/upload-artifact@v7
        with:
          name: repository-contracts-1.0.0
          path: repository-contracts-1.0.0.zip

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @scenara/console exec playwright install --with-deps chromium
      - run: pnpm run console:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: console-playwright-report
          path: frontend/console/playwright-report
      - name: Build console container stage
        run: docker build --target console-builder -t scenara-console-builder:ci .

  integration-services:
    runs-on: ubuntu-24.04
    env:
      SCENARA_RUN_INTEGRATION: "1"
      SCENARA_POSTGRES_PASSWORD: scenara-integration
      SCENARA_API_TOKEN: integration-api-token
      SCENARA_S3_ACCESS_KEY: scenara
      SCENARA_INTEGRATION_S3_ACCESS_KEY: scenara
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/production.lock
      - run: python -m pip install -r requirements/dev.txt
      - name: Generate ephemeral encryption key
        run: |
          python -c "from cryptography.fernet import Fernet; print('SCENARA_SECRET_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
          python -c "import secrets; value=secrets.token_urlsafe(32); print('SCENARA_S3_SECRET_KEY=' + value); print('SCENARA_INTEGRATION_S3_SECRET_KEY=' + value); print('SCENARA_S3_ACCESS_KEY=scenara'); print('SCENARA_INTEGRATION_S3_ACCESS_KEY=scenara')" >> "$GITHUB_ENV"
      - name: Start PostgreSQL, Redis, and MinIO
        # Compose interpolates every required variable even when only the data
        # services start. Keep the adapter path scoped to the Compose steps so
        # the pytest process never inherits it and tries to import the module.
        env:
          SCENARA_OCR_ENGINE_FACTORY: compose_interpolation_only:create_engine
        run: |
          compose=(docker compose -p scenara-integration -f deploy/compose.yml -f deploy/compose.integration.yml)
          for attempt in 1 2 3; do
            if "${compose[@]}" up -d --wait postgres redis minio; then
              break
            fi
            "${compose[@]}" ps || true
            "${compose[@]}" logs --no-color --tail=100 postgres redis minio || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Apply integration database migrations
        env:
          SCENARA_OCR_ENGINE_FACTORY: compose_interpolation_only:create_engine
        run: |
          compose=(docker compose -p scenara-integration -f deploy/compose.yml -f deploy/compose.integration.yml)
          for attempt in 1 2 3; do
            if "${compose[@]}" run --rm migrate; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Initialize integration object store
        env:
          SCENARA_OCR_ENGINE_FACTORY: compose_interpolation_only:create_engine
        run: |
          compose=(docker compose -p scenara-integration -f deploy/compose.yml -f deploy/compose.integration.yml)
          for attempt in 1 2 3; do
            if "${compose[@]}" run --rm minio-init; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - run: python -m pytest -q -m integration tests/integration --junitxml=integration-services.junit.xml
      - name: Capture service logs
        if: always()
        env:
          SCENARA_OCR_ENGINE_FACTORY: compose_interpolation_only:create_engine
        run: |
          mkdir -p runtime-state/logs
          docker compose -p scenara-integration -f deploy/compose.yml -f deploy/compose.integration.yml logs --no-color > runtime-state/logs/integration-services.compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-services
          path: |
            integration-services.junit.xml
            runtime-state/logs/integration-services.compose.log
      - name: Stop integration services
        if: always()
        env:
          SCENARA_OCR_ENGINE_FACTORY: compose_interpolation_only:create_engine
        run: docker compose -p scenara-integration -f deploy/compose.yml -f deploy/compose.integration.yml down --volumes --remove-orphans

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/production.lock
      - run: python -m pip install -r requirements/dev.txt pip-licenses==5.5.5
      - run: pip-licenses --format=json --with-urls --with-license-file --output-file=python-licenses.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses list --json > javascript-licenses.json
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: supply-chain-evidence
          path: |
            sbom.cdx.json
            python-licenses.json
            javascript-licenses.json

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements/dev.txt pip-audit==2.10.1
      - name: Security contract tests
        run: >-
          python -m pytest -q
          tests/test_security_media.py
          tests/test_platform_extensions.py
          tests/test_platform_kernel.py
          tests/test_portrait_analysis.py
          tests/test_portrait_identity.py
          tests/test_api.py
          --junitxml=security-tests.junit.xml
      - run: python -m pip_audit -r requirements/dev.txt --format json --output python-dev-audit.json
      - run: python -m pip_audit -r requirements/production.lock --format json --output python-production-audit.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high --json > javascript-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-tests
          path: |
            security-tests.junit.xml
            python-dev-audit.json
            python-production-audit.json
            javascript-audit.json

  backup-restore-drill:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: scenara-backup-drill
      SCENARA_POSTGRES_PASSWORD: scenara-backup-drill
      SCENARA_API_TOKEN: backup-drill-api-token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Configure drill
        run: |
          encryption_key="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          s3_secret="$(openssl rand -base64 32 | tr -d '\n')"
          cat > "$RUNNER_TEMP/scenara.env" <<EOF
          SCENARA_POSTGRES_PASSWORD=$SCENARA_POSTGRES_PASSWORD
          SCENARA_S3_SECRET_KEY=$s3_secret
          SCENARA_API_TOKEN=$SCENARA_API_TOKEN
          SCENARA_SECRET_ENCRYPTION_KEY=$encryption_key
          SCENARA_OCR_ENGINE_FACTORY=compose_interpolation_only:create_engine
          EOF
          chmod 600 "$RUNNER_TEMP/scenara.env"
          echo "SCENARA_COMPOSE_ENV_FILE=$RUNNER_TEMP/scenara.env" >> "$GITHUB_ENV"
      - name: Seed PostgreSQL and MinIO
        run: |
          docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml up -d --wait postgres minio
          docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml run --rm migrate
          docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml run --rm minio-init
          docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml exec -T postgres \
            psql -U scenara -d scenara -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE qualification_marker(value text PRIMARY KEY); INSERT INTO qualification_marker VALUES ('scenara-backup-ok');"
          docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml run --rm --no-deps -T \
            --entrypoint /bin/sh minio-init -c \
            'mc alias set local http://minio:9000 "$ACCESS_KEY" "$SECRET_KEY" >/dev/null && printf scenara-object-ok | mc pipe local/scenara/qualification/marker.txt'
      - name: Backup, mutate, and restore
        run: |
          bash deploy/scripts/backup.sh "$RUNNER_TEMP/backup"
          docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml exec -T postgres \
            psql -U scenara -d scenara -v ON_ERROR_STOP=1 -c "DROP TABLE qualification_marker;"
          docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml run --rm --no-deps -T \
            --entrypoint /bin/sh minio-init -c \
            'mc alias set local http://minio:9000 "$ACCESS_KEY" "$SECRET_KEY" >/dev/null && mc rm local/scenara/qualification/marker.txt'
          SCENARA_RESTORE_DATA_ONLY=true bash deploy/scripts/restore.sh "$RUNNER_TEMP/backup" --confirm
      - name: Verify restored records
        run: |
          test "$(docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml exec -T postgres \
            psql -U scenara -d scenara -tAc "SELECT value FROM qualification_marker")" = "scenara-backup-ok"
          test "$(docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml run --rm --no-deps -T \
            --entrypoint /bin/sh minio-init -c \
            'mc alias set local http://minio:9000 "$ACCESS_KEY" "$SECRET_KEY" >/dev/null && mc cat local/scenara/qualification/marker.txt')" = "scenara-object-ok"
          printf 'backup_restore=passed\nverified_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/backup-restore-drill.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backup-restore-drill
          path: |
            ${{ runner.temp }}/backup/SHA256SUMS
            ${{ runner.temp }}/backup/container-images.txt
            ${{ runner.temp }}/backup/compose-version.txt
            ${{ runner.temp }}/backup/compose-file.sha256
            ${{ runner.temp }}/backup/source-commit.txt
            ${{ runner.temp }}/backup/created-at.txt
            ${{ runner.temp }}/backup-restore-drill.txt
      - name: Stop drill services
        if: always()
        run: docker compose --env-file "$SCENARA_COMPOSE_ENV_FILE" -f deploy/compose.yml down --volumes --remove-orphans
