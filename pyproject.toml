[project]
name = "scenara"
version = "0.3.0.dev9"
requires-python = ">=3.12"
description = "Scenara enterprise vision parsing platform"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL, Redis, or S3-compatible services"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
strict = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "typings", "models", "runtime-state"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
