[project]
name = "scenara"
version = "0.3.0.dev42"
requires-python = ">=3.12"
description = "Scenara self-hosted vision parsing service for system integration"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL, Redis, or S3-compatible services"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
strict = true
