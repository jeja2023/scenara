name: scenara-data

services:
  data:
    image: scenara-data:${SCENARA_DATA_IMAGE_TAG:-0.3.0-dev.29}
    build:
      context: ..
      dockerfile: Dockerfile.data
    environment:
      SCENARA_DATA_SERVICE_TOKEN: ${SCENARA_DATA_SERVICE_TOKEN:?set SCENARA_DATA_SERVICE_TOKEN}
      SCENARA_DATA_STATE_PATH: /var/lib/scenara-data/data.db
    ports:
      - "127.0.0.1:${SCENARA_DATA_PORT:-8010}:8010"
    volumes:
      - scenara-data-state:/var/lib/scenara-data
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    pids_limit: 256
    mem_limit: ${SCENARA_DATA_MEMORY_LIMIT:-2g}
    cpus: ${SCENARA_DATA_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  scenara-data-state:
