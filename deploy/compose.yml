name: scenara

x-scenara-environment: &scenara-environment
  SCENARA_PROFILE: production
  SCENARA_STATE_BACKEND: postgres
  SCENARA_OBJECT_BACKEND: s3
  SCENARA_QUEUE_BACKEND: redis
  SCENARA_POSTGRES_DSN: postgresql://scenara:${SCENARA_POSTGRES_PASSWORD:?set SCENARA_POSTGRES_PASSWORD}@postgres:5432/scenara
  SCENARA_REDIS_URL: redis://redis:6379/0
  SCENARA_S3_ENDPOINT_URL: http://minio:9000
  SCENARA_S3_REGION: us-east-1
  SCENARA_S3_BUCKET: scenara
  SCENARA_S3_ACCESS_KEY: ${SCENARA_S3_ACCESS_KEY:-scenara}
  SCENARA_S3_SECRET_KEY: ${SCENARA_S3_SECRET_KEY:?set SCENARA_S3_SECRET_KEY}
  SCENARA_AUTH_REQUIRED: "true"
  SCENARA_API_TOKEN: ${SCENARA_API_TOKEN:?set SCENARA_API_TOKEN}
  SCENARA_PRODUCTION_MODELS_REQUIRED: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scenara
      POSTGRES_USER: scenara
      POSTGRES_PASSWORD: ${SCENARA_POSTGRES_PASSWORD:?set SCENARA_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenara -d scenara"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${SCENARA_POSTGRES_PASSWORD:?set SCENARA_POSTGRES_PASSWORD}
    volumes:
      - ../migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "scenara", "-d", "scenara", "-f", "/migrations/0001_initial.sql"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ROOT_USER: ${SCENARA_S3_ACCESS_KEY:-scenara}
      MINIO_ROOT_PASSWORD: ${SCENARA_S3_SECRET_KEY:?set SCENARA_S3_SECRET_KEY}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ACCESS_KEY: ${SCENARA_S3_ACCESS_KEY:-scenara}
      SECRET_KEY: ${SCENARA_S3_SECRET_KEY:?set SCENARA_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$${ACCESS_KEY}" "$${SECRET_KEY}" && mc mb --ignore-existing local/scenara
    restart: "no"

  api:
    build:
      context: ..
    environment: *scenara-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  batch-worker:
    build:
      context: ..
    command: ["python3", "-m", "scenara.worker", "--consumer", "batch-gpu-1"]
    environment: *scenara-environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../models:/opt/scenara/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
