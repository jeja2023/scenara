name: scenara

x-scenara-environment: &scenara-environment
  SCENARA_PROFILE: production
  SCENARA_STATE_BACKEND: postgres
  SCENARA_OBJECT_BACKEND: s3
  SCENARA_QUEUE_BACKEND: redis
  SCENARA_POSTGRES_DSN: postgresql://scenara:${SCENARA_POSTGRES_PASSWORD:?set SCENARA_POSTGRES_PASSWORD}@postgres:5432/scenara
  SCENARA_REDIS_URL: redis://redis:6379/0
  SCENARA_S3_ENDPOINT_URL: http://minio:9000
  SCENARA_S3_REGION: us-east-1
  SCENARA_S3_BUCKET: scenara
  SCENARA_S3_ACCESS_KEY: ${SCENARA_S3_ACCESS_KEY:-scenara}
  SCENARA_S3_SECRET_KEY: ${SCENARA_S3_SECRET_KEY:?set SCENARA_S3_SECRET_KEY}
  SCENARA_AUTH_REQUIRED: "true"
  SCENARA_API_TOKEN: ${SCENARA_API_TOKEN:?set SCENARA_API_TOKEN}
  SCENARA_PRODUCTION_MODELS_REQUIRED: "true"
  SCENARA_OCR_ENGINE_FACTORY: ${SCENARA_OCR_ENGINE_FACTORY:?set SCENARA_OCR_ENGINE_FACTORY}
  SCENARA_SECRET_ENCRYPTION_KEY: ${SCENARA_SECRET_ENCRYPTION_KEY:?set SCENARA_SECRET_ENCRYPTION_KEY}
  SCENARA_ENTERPRISE_POLICY_REQUIRED: "true"
  SCENARA_ENTERPRISE_LICENSE_PATH: /run/secrets/scenara_enterprise_license
  SCENARA_ENTERPRISE_PUBLIC_KEY_PATH: /run/secrets/scenara_enterprise_public_key
  PYTHONPATH: /opt/scenara/models
  SCENARA_RAW_MEDIA_RETENTION_DAYS: ${SCENARA_RAW_MEDIA_RETENTION_DAYS:-7}
  SCENARA_PREVIEW_RETENTION_DAYS: ${SCENARA_PREVIEW_RETENTION_DAYS:-30}
  SCENARA_STRUCTURED_RESULT_RETENTION_DAYS: ${SCENARA_STRUCTURED_RESULT_RETENTION_DAYS:-180}
  SCENARA_ALLOW_PRIVATE_MEDIA_SOURCES: ${SCENARA_ALLOW_PRIVATE_MEDIA_SOURCES:-false}
  SCENARA_ALLOW_PRIVATE_WEBHOOK_TARGETS: ${SCENARA_ALLOW_PRIVATE_WEBHOOK_TARGETS:-false}

x-scenara-enterprise-secrets: &scenara-enterprise-secrets
  - scenara_enterprise_license
  - scenara_enterprise_public_key

services:
  postgres:
    image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: scenara
      POSTGRES_USER: scenara
      POSTGRES_PASSWORD: ${SCENARA_POSTGRES_PASSWORD:?set SCENARA_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenara -d scenara"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${SCENARA_POSTGRES_PASSWORD:?set SCENARA_POSTGRES_PASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: scenara
      PGUSER: scenara
    volumes:
      - ../migrations:/migrations:ro
      - ./scripts:/deploy-scripts:ro
    command: ["sh", "/deploy-scripts/migrate.sh"]
    restart: "no"

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    environment:
      MINIO_ROOT_USER: ${SCENARA_S3_ACCESS_KEY:-scenara}
      MINIO_ROOT_PASSWORD: ${SCENARA_S3_SECRET_KEY:?set SCENARA_S3_SECRET_KEY}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ACCESS_KEY: ${SCENARA_S3_ACCESS_KEY:-scenara}
      SECRET_KEY: ${SCENARA_S3_SECRET_KEY:?set SCENARA_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$${ACCESS_KEY}" "$${SECRET_KEY}" && mc mb --ignore-existing local/scenara
    restart: "no"

  api:
    image: scenara-api:${SCENARA_IMAGE_TAG:-0.3.0-dev.12}
    build:
      context: ..
    environment: *scenara-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../models:/opt/scenara/models:ro
    secrets: *scenara-enterprise-secrets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  batch-worker:
    image: scenara-api:${SCENARA_IMAGE_TAG:-0.3.0-dev.12}
    build:
      context: ..
    command: ["python3", "-m", "scenara.worker", "--consumer", "batch-gpu-1", "--lane", "batch"]
    environment: *scenara-environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../models:/opt/scenara/models:ro
    secrets: *scenara-enterprise-secrets
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  stream-worker:
    image: scenara-api:${SCENARA_IMAGE_TAG:-0.3.0-dev.12}
    build:
      context: ..
    command: ["python3", "-m", "scenara.worker", "--consumer", "stream-gpu-1", "--lane", "stream"]
    environment: *scenara-environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../models:/opt/scenara/models:ro
    secrets: *scenara-enterprise-secrets
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  scheduler:
    image: scenara-api:${SCENARA_IMAGE_TAG:-0.3.0-dev.12}
    build:
      context: ..
    command: ["python3", "-m", "scenara.scheduler", "--interval-seconds", "60"]
    environment: *scenara-environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../models:/opt/scenara/models:ro
    secrets: *scenara-enterprise-secrets
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

secrets:
  scenara_enterprise_license:
    file: ${SCENARA_ENTERPRISE_LICENSE_FILE:-./.env.production.example}
  scenara_enterprise_public_key:
    file: ${SCENARA_ENTERPRISE_PUBLIC_KEY_FILE:-./.env.production.example}
