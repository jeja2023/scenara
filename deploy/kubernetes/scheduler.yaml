apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenara-scheduler
  labels:
    app.kubernetes.io/name: scenara-scheduler
    app.kubernetes.io/part-of: scenara-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scenara-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenara-scheduler
        app.kubernetes.io/part-of: scenara-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: scenara-api:0.3.0-dev.39
          imagePullPolicy: IfNotPresent
          command:
            [
              "python3",
              "-m",
              "scenara.scheduler",
              "--interval-seconds",
              "60",
              "--webhook-interval-seconds",
              "1",
            ]
          envFrom:
            - configMapRef:
                name: scenara-runtime
            - secretRef:
                name: scenara-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: runtime-state
              mountPath: /opt/scenara/runtime-state
            - name: qualified-models
              mountPath: /opt/scenara/models
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
        - name: runtime-state
          emptyDir:
            sizeLimit: 256Mi
        - name: qualified-models
          persistentVolumeClaim:
            claimName: scenara-qualified-models
