apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenara-batch-worker
  labels:
    app.kubernetes.io/name: scenara-batch-worker
    app.kubernetes.io/part-of: scenara-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scenara-batch-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenara-batch-worker
        app.kubernetes.io/part-of: scenara-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: scenara-api:0.3.0-dev.31
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "scenara.worker", "--consumer", "batch-k8s", "--lane", "batch"]
          envFrom:
            - configMapRef:
                name: scenara-runtime
            - secretRef:
                name: scenara-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: runtime-state
              mountPath: /opt/scenara/runtime-state
            - name: qualified-models
              mountPath: /opt/scenara/models
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 4Gi
        - name: runtime-state
          emptyDir:
            sizeLimit: 512Mi
        - name: qualified-models
          persistentVolumeClaim:
            claimName: scenara-qualified-models
---
