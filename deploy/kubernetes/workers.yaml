apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenara-batch-worker
  labels:
    app.kubernetes.io/name: scenara-batch-worker
    app.kubernetes.io/part-of: scenara-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scenara-batch-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenara-batch-worker
        app.kubernetes.io/part-of: scenara-platform
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: scenara-api:0.3.0-dev.23
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "scenara.worker", "--consumer", "batch-k8s", "--lane", "batch"]
          envFrom:
            - configMapRef:
                name: scenara-runtime
            - secretRef:
                name: scenara-runtime
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
---
