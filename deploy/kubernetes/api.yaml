apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenara-api
  labels:
    app.kubernetes.io/name: scenara-api
    app.kubernetes.io/part-of: scenara-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scenara-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenara-api
        app.kubernetes.io/part-of: scenara-platform
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: scenara-api:0.3.0-dev.19
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: scenara-runtime
            - secretRef:
                name: scenara-runtime
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scenara-api
  labels:
    app.kubernetes.io/name: scenara-api
spec:
  selector:
    app.kubernetes.io/name: scenara-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scenara-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scenara-api
