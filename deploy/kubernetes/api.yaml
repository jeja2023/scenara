apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenara-api
  labels:
    app.kubernetes.io/name: scenara-api
    app.kubernetes.io/part-of: scenara-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scenara-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenara-api
        app.kubernetes.io/part-of: scenara-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scenara-api
      containers:
        - name: api
          image: scenara-api:0.3.0-dev.40
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: scenara-runtime
            - secretRef:
                name: scenara-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: runtime-state
              mountPath: /opt/scenara/runtime-state
            - name: qualified-models
              mountPath: /opt/scenara/models
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 2Gi
        - name: runtime-state
          emptyDir:
            sizeLimit: 512Mi
        - name: qualified-models
          persistentVolumeClaim:
            claimName: scenara-qualified-models
---
apiVersion: v1
kind: Service
metadata:
  name: scenara-api
  labels:
    app.kubernetes.io/name: scenara-api
spec:
  selector:
    app.kubernetes.io/name: scenara-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scenara-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scenara-api
