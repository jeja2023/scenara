capabilities:
  person_detection:
    status: ready
    model_id: person_detector_default
    adapter: yolo
    production_adapter: yolo
    production_model: YOLOv8 person detector ONNX
    input_size: [640, 640]
    output:
      confidence: 0.25
      iou: 0.45
      max_detections: 8
    fallback_model_id: scenara.development.whole_image_person
  body_embedding:
    status: ready
    model_id: person_reid_default
    adapter: reid
    production_adapter: reid
    production_model: OSNet IBN person ReID ONNX
    input_size: [256, 128]
    preprocess: imagenet
    embedding_dim: 512
    normalize: l2
    fallback_model_id: scenara.development.image_fingerprint_v1
  pose:
    status: ready
    model_id: yolov8n_pose_default
    adapter: yolo_pose
    production_adapter: yolo_pose
    production_model: YOLOv8 Pose Estimation ONNX/PT
    input_size: [640, 640]
    keypoint_schema: coco17
    preprocess: imagenet
    fallback_model_id: scenara.development.geometric_pose
  face_detection:
    status: ready
    model_id: face_detector_default
    adapter: scrfd
    production_adapter: scrfd
    production_model: SCRFD 500M / 10G ONNX
    input_size: [640, 640]
    output:
      decoded: false
      bbox_scale: stride
      confidence: 0.35
      iou: 0.45
    fallback_model_id: opencv/haarcascade_frontalface_default
  face_embedding:
    status: ready
    model_id: face_embedding_default
    adapter: arcface
    production_adapter: arcface
    production_model: ArcFace MobileFaceNet ONNX
    input_size: [112, 112]
    preprocess: rgb_minus_127p5_div_128
    embedding_dim: 512
    production_embedding_dim: 512
    normalize: l2
    fallback_model_id: scenara.development.image_fingerprint_v1
  gait:
    status: ready
    model_id: gait_default
    adapter: opengait
    production_adapter: opengait
    production_model: OpenGait Gait3D ONNX export
    input_size: [64, 44]
    sequence_layout: ntchw
    embedding_dim: 256
    production_embedding_dim: 256
    normalize: l2
    sequence_input: true
    fallback_model_id: scenara.development.tracklet_fingerprint_v1
  appearance:
    status: ready
    model_id: appearance_default
    adapter: attribute_reid
    production_adapter: attribute_reid
    production_model: Attribute ReID ONNX
    input_size: [256, 128]
    preprocess: imagenet
    embedding_dim: 256
    production_embedding_dim: 256
    normalize: l2
    fallback_model_id: scenara.development.color_histogram_v1
